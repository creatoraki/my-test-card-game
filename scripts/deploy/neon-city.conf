# 此文件由公共入口 server 引入，不要另加 server 块。
location = /neon-city {
    return 308 /neon-city/$is_args$args;
}

# 多个版本共用带哈希的素材；缺失素材直接返回 404。
location /neon-city/assets/ {
    alias /var/www/neon-city/shared/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /neon-city/index.html {
    root /var/www/neon-city/web;
    add_header Cache-Control "no-store" always;
}

location /neon-city/ {
    root /var/www/neon-city/web;
    index index.html;
    try_files $uri $uri/ /neon-city/index.html;
    add_header Cache-Control "no-cache" always;
}
