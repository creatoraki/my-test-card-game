server {
    listen 80;
    server_name __SERVER_NAMES__;

    charset utf-8;

    access_log /var/log/nginx/neon-city.access.log;
    error_log /var/log/nginx/neon-city.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 每个服务独立维护路由文件，游戏更新不覆盖其他服务配置。
    include /etc/nginx/web-services/*.conf;

    # 根路径留给后续入口页或其他服务。
    location / {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
