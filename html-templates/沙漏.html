<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沙漏 · Hourglass</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;
    background:radial-gradient(1200px 800px at 50% 35%,#101527,#070a14 55%,#04050b);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;
  }
  h1{color:#8fa3c8;font-weight:300;letter-spacing:.4em;font-size:15px;margin-bottom:10px;text-indent:.4em}
  #stage{position:relative}
  canvas{width:min(92vw,520px);height:auto;display:block}
  #timer{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    color:#cfe0ff;font-size:13px;letter-spacing:.15em;opacity:.75;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    padding:4px 14px;border-radius:20px;backdrop-filter:blur(4px);pointer-events:none;
  }
  .panel{margin-top:14px;text-align:center}
  #colorBtn{
    cursor:pointer;color:#e8eefc;font-size:14px;letter-spacing:.1em;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);
    padding:9px 22px;border-radius:24px;backdrop-filter:blur(6px);
    display:inline-flex;align-items:center;gap:9px;
    transition:transform .15s,box-shadow .3s,border-color .3s;
  }
  #colorBtn:hover{transform:translateY(-2px)}
  #colorBtn .dot{
    width:13px;height:13px;border-radius:50%;
    box-shadow:0 0 10px 2px currentColor;transition:background .4s;
  }
  .tip{margin-top:8px;color:#5d6f92;font-size:12px;letter-spacing:.12em}
</style>
</head>
<body>
<h1>HOURGLASS</h1>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="timer">60.0 s</div>
</div>
<div class="panel">
  <button id="colorBtn"><span class="dot"></span><span class="label">粒子特效 · 鎏金</span></button>
  <div class="tip">60 秒漏尽 · 自动倒转 · 点击按钮切换 5 档颜色</div>
</div>

<script>
(() => {
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const timerEl = document.getElementById('timer');
const btn = document.getElementById('colorBtn');
const dot = btn.querySelector('.dot');
const label = btn.querySelector('.label');

const W = 520, H = 720;
const dpr = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * dpr; cv.height = H * dpr;

/* ========== 几何常量 ========== */
const TOP = -170, BOT = 170;
const R = 92, NECK = 9;
const DRAIN_MS = 60000;
const FLIP_MS  = 1600;

/* ========== 5 档颜色 ========== */
const PALETTE = [
  { name:'鎏金', rgb:[255,200,110] },
  { name:'青冥', rgb:[ 94,230,255] },
  { name:'幻紫', rgb:[180,140,255] },
  { name:'绯樱', rgb:[255,122,184] },
  { name:'翠影', rgb:[124,255,158] },
];
let colorIdx = 0;
let cur = [...PALETTE[0].rgb];
let target = [...PALETTE[0].rgb];

const rgba   = (c,a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const lighten= (c,k) => c.map(v => v + (255-v)*k);
const shade  = (c,k) => c.map(v => v * (1-k));

/* ========== 状态 ========== */
let phase = 'drain', phaseStart = performance.now();
let rotationTurns = 0;
let pileApex = BOT;

/* ========== 工具函数 ========== */
// 沙漏半宽轮廓：沿玻璃 Bézier 采样，保证粒子范围与真实玻璃一致
const GLASS_HALF_WIDTH_LUT = (() => {
  const N = 220;
  const pts = [];
  for(let i=0;i<=N;i++){
    const t = i/N, mt = 1-t;
    const y = TOP*mt*mt*mt
            + 3*(TOP+95)*t*mt*mt
            + 3*(-55)*t*t*mt
            + 0*t*t*t;
    const x = -R*mt*mt*mt
            + 3*(-R)*t*mt*mt
            + 3*(-NECK)*t*t*mt
            + (-NECK)*t*t*t;
    pts.push({ h:-y, w:-x });
  }
  pts.sort((a,b)=>a.h-b.h);
  return pts;
})();
function bulbHalfWidth(y){
  const h = Math.min(170, Math.max(0, Math.abs(y)));
  if(h <= 0) return NECK;
  if(h >= 170) return R;
  let lo = 0, hi = GLASS_HALF_WIDTH_LUT.length - 1;
  while(lo + 1 < hi){
    const mid = (lo + hi) >> 1;
    if(GLASS_HALF_WIDTH_LUT[mid].h <= h) lo = mid; else hi = mid;
  }
  const a = GLASS_HALF_WIDTH_LUT[lo], b = GLASS_HALF_WIDTH_LUT[hi];
  const k = (h - a.h) / (b.h - a.h || 1);
  return a.w + (b.w - a.w) * k;

}

// 玻璃裁剪路径
function glassPath(){
  ctx.beginPath();
  ctx.moveTo(-R, TOP);
  ctx.bezierCurveTo(-R, TOP+95, -NECK, -55, -NECK, 0);
  ctx.bezierCurveTo(-NECK,  55, -R, BOT-95, -R, BOT);
  ctx.lineTo(R, BOT);
  ctx.bezierCurveTo(R, BOT-95, NECK, 55, NECK, 0);
  ctx.bezierCurveTo(NECK, -55, R, TOP+95, R, TOP);
  ctx.closePath();
}

const easeInOut = p => p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2,2)/2;

/* ========== 粒子系统 ========== */
const parts = [];
function newParticle(randomAge){
  let y = (Math.random()*2-1)*155;
  if(Math.abs(y) < 28) y += (y<0?-1:1)*34;
  const hw = bulbHalfWidth(y)*0.78;
  return {
    x:(Math.random()*2-1)*hw, y,
    vy:-(3+Math.random()*9), ph:Math.random()*6.28,
    size:.8+Math.random()*1.9,
    life: randomAge ? Math.random()*6 : 0,
    max: 4+Math.random()*5
  };
}
for(let i=0;i<70;i++) parts.push(newParticle(true));

function updateParticles(dt, ts){
  for(let i=0;i<parts.length;i++){
    const p = parts[i];
    p.life += dt;
    if(p.life > p.max){ parts[i] = newParticle(false); continue; }
    p.y += p.vy * dt;
    p.x += Math.sin(ts*0.0008 + p.ph) * 10 * dt;
    const hw = bulbHalfWidth(p.y)*0.85;
    if(p.x >  hw) p.x =  hw;
    if(p.x < -hw) p.x = -hw;
    if(Math.abs(p.y) > 160) p.y = Math.sign(p.y)*160;
  }
}

function drawParticles(){
  ctx.save(); glassPath(); ctx.clip();
  for(const p of parts){
    const a = Math.sin(Math.PI * Math.min(1, p.life/p.max)) * 0.9;
    ctx.globalAlpha = a;
    ctx.fillStyle = rgba(lighten(cur,.3),1);
    ctx.shadowColor = rgba(cur,.95);
    ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill();
  }
  ctx.restore();
}

/* ========== 沙子绘制（核心优化） ========== */
function drawSand(f, mirrorY=false, opacity=1){
  ctx.save(); glassPath(); ctx.clip();
  if(mirrorY) ctx.scale(1,-1);
  ctx.globalAlpha = opacity;

  /* --- 底部沙堆 --- */
  const hBot = (1-f)*112;
  pileApex = BOT - hBot;
  if(hBot > .5){
    const g = ctx.createLinearGradient(0, pileApex, 0, BOT);
    g.addColorStop(0, rgba(lighten(cur,.25),.98));
    g.addColorStop(1, rgba(shade(cur,.45),.98));
    ctx.fillStyle = g;
    const s = 110;
    ctx.beginPath();
    ctx.moveTo(-s-20, BOT+20); ctx.lineTo(-s-20, BOT);
    ctx.quadraticCurveTo(-s*.45, pileApex+hBot*.22, 0, pileApex);
    ctx.quadraticCurveTo( s*.45, pileApex+hBot*.22, s, BOT);
    ctx.lineTo(s+20, BOT+20); ctx.closePath(); ctx.fill();
    // 沉积纹理
    ctx.strokeStyle='rgba(0,0,0,.10)'; ctx.lineWidth=1;
    for(let i=1;i<=3;i++){
      const yy = pileApex + hBot*i/3.6;
      const qq = (yy - pileApex) / hBot;
        const ww = s * (0.9*qq*(1-qq) + qq*qq);
      ctx.beginPath(); ctx.moveTo(-ww,yy+3);
      ctx.quadraticCurveTo(0,yy-2,ww,yy+3); ctx.stroke();
    }
  }

  /* --- 顶部沙子（受重力贴壁下沉的漏斗）--- */
    if(f > 0.002){
      const surfaceY = -12 - 140*f;
      const craterY = 4;
      const dip = craterY - surfaceY;
      const Ws = bulbHalfWidth(surfaceY) + 4;
      const pileBaseY = Math.max(surfaceY, -28);
      const pileWidth = Math.max(12, bulbHalfWidth(pileBaseY) * .92);
      const STEPS = 30;

      const g = ctx.createLinearGradient(0, surfaceY, 0, 8);
      g.addColorStop(0, rgba(lighten(cur,.2),.98));
      g.addColorStop(1, rgba(shade(cur,.5),.98));
      ctx.fillStyle = g;

      ctx.beginPath();
      ctx.moveTo(-Ws, surfaceY);
      ctx.lineTo(Ws, surfaceY);
      for(let i=1;i<=STEPS;i++){
        const q = i/STEPS;
        const yy = surfaceY + (pileBaseY - surfaceY)*q;
        ctx.lineTo(bulbHalfWidth(yy), yy);
      }
      for(let i=STEPS;i>=1;i--){
        const q = i/STEPS;
        const yy = surfaceY + (pileBaseY - surfaceY)*q;
        ctx.lineTo(-bulbHalfWidth(yy), yy);
      }
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-pileWidth, pileBaseY);
      ctx.quadraticCurveTo(-pileWidth*.52, pileBaseY+2, 0, craterY);
      ctx.quadraticCurveTo(pileWidth*.52, pileBaseY+2, pileWidth, pileBaseY);
      ctx.closePath();
      ctx.fill();

      
      
      const craterR = Math.max(14, Ws * .38);
      const rg = ctx.createRadialGradient(0, craterY, 1, 0, craterY, craterR * .9);
      rg.addColorStop(0, 'rgba(0,0,0,.10)');
      
      
      
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(-Ws, surfaceY - 4, Ws * 2, dip + 20);

      ctx.strokeStyle = rgba(lighten(cur,.35), .18);
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.ellipse(0, pileBaseY - 1, pileWidth * .72, Math.max(3, Math.min(12, (pileBaseY - craterY) * .12)), 0, 0, 7);
      ctx.stroke();
    }

  if(false){ // 旧版倒三角悬挂实现，已弃用
      const hTop = f * 112;
      const topApex = TOP + hTop;
      const s = 110;

      const g = ctx.createLinearGradient(0, topApex, 0, TOP);
      g.addColorStop(0, rgba(lighten(cur,.25),.98));
      g.addColorStop(1, rgba(shade(cur,.45),.98));
      ctx.fillStyle = g;

      ctx.beginPath();
      ctx.moveTo(-s-20, TOP-20);
      ctx.lineTo(-s-20, TOP);
      ctx.quadraticCurveTo(-s*.45, topApex - hTop*.22, 0, topApex);
      ctx.quadraticCurveTo( s*.45, topApex - hTop*.22, s, TOP);
      ctx.lineTo(s+20, TOP-20);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(0,0,0,.10)';
      ctx.lineWidth = 1;
      for(let i=1;i<=3;i++){
        const yy = topApex - hTop*i/3.6;
        const qq = (yy - topApex) / (TOP - topApex);
        const ww = s * (0.9*qq*(1-qq) + qq*qq);
        ctx.beginPath();
        ctx.moveTo(-ww, yy-3);
        ctx.quadraticCurveTo(0, yy+2, ww, yy-3);
        ctx.stroke();
      }
    }
    if(false){ // 旧版“贴壁漏斗”实现，已弃用
    // 沙面整体随 f 下降
    const surfaceY = -6 - 148*f;
      // 漏斗底部固定在颈部，沙面从两侧玻璃壁向中心凹陷
      const craterY = 4;
      const dip = craterY - surfaceY;
      const STEPS = 28;
      const Ws = bulbHalfWidth(surfaceY) + 4;
      const craterR = Math.max(20, Ws * .42);
      /*
    // 下凹深度：开始小 → 中间最大 → 快漏完时收窄
    const dipStrength = Math.sin(Math.PI * f);          // 0→1→0 钟形
    const dip = 6 + 22 * dipStrength;                   // 6~28px
    // 凹陷半径也随 f 变化（越接近颈部越窄）
    const craterR = 18 + 20 * dipStrength;

    */

    // 沙体渐变
    const g = ctx.createLinearGradient(0, surfaceY, 0, 8);
    g.addColorStop(0, rgba(lighten(cur,.2),.98));
    g.addColorStop(1, rgba(shade(cur,.5),.98));
    ctx.fillStyle = g;

    // 用采样折线沿玻璃轮廓内收，形成真正通到颈部的漏斗面
    ctx.beginPath();
    ctx.moveTo(-Ws, surfaceY);
      for(let i=1;i<STEPS;i++){
        const q = i/STEPS;
        const yy = surfaceY + dip*q;
        const r = bulbHalfWidth(yy) * (1 - Math.pow(q, 1.2));
        ctx.lineTo(-r, yy);
      }
      ctx.lineTo(0, craterY);
      for(let i=STEPS-1;i>0;i--){
        const q = i/STEPS;
        const yy = surfaceY + dip*q;
        const r = bulbHalfWidth(yy) * (1 - Math.pow(q, 1.2));
        ctx.lineTo(r, yy);
      }
      ctx.lineTo(Ws, surfaceY);
      /*
    // 左半弧：从壁边平滑滑入凹陷底部
    ctx.bezierCurveTo(
      -Ws*0.55, surfaceY + dip*0.15,
      -craterR*0.7, surfaceY + dip*0.7,
      0, surfaceY + dip
    );
    // 右半弧：对称上升回壁边
    ctx.bezierCurveTo(
       craterR*0.7, surfaceY + dip*0.7,
       Ws*0.55, surfaceY + dip*0.15,
       Ws, surfaceY
    );
    */
      // 向下封闭到球体底部区域
    ctx.lineTo(Ws, 8);
    ctx.lineTo(-Ws, 8);
    ctx.closePath();
    ctx.fill();
      /*

    */
      // 凹陷内部阴影（增强立体漏斗感）
    const rg = ctx.createRadialGradient(
      0, surfaceY + dip, 1,
      0, surfaceY + dip, craterR * 1.2
    );
    rg.addColorStop(0, 'rgba(0,0,0,.30)');
    rg.addColorStop(.6,'rgba(0,0,0,.10)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(-craterR*1.5, surfaceY-4, craterR*3, dip+20);

    // 凹陷边缘高光环（模拟沙粒沿斜面滑落的光泽）
    ctx.strokeStyle = rgba(lighten(cur,.35), .25);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(0, surfaceY + dip*0.35, craterR*0.85, dip*0.18, 0, 0, 7);
    ctx.stroke();
  }

  ctx.restore();
}

/* ========== 下落沙流 ========== */
function drawStream(ts){
  if(phase !== 'drain') return;
  const f = Math.max(0, 1-(ts-phaseStart)/DRAIN_MS);
  if(f <= .002 || f >= .999) return;
  const startY = 3;
    
    const endY = pileApex - 2;
    const streamLen = Math.max(8, endY - startY);
  const g = ctx.createLinearGradient(0,startY,0,endY);
  g.addColorStop(0, rgba(shade(cur,.6),.9));
  g.addColorStop(1, rgba(lighten(cur,.2),.9));
  ctx.strokeStyle = g; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0,startY); ctx.lineTo(0,endY); ctx.stroke();
  // 发光沙粒
  ctx.save();
  ctx.shadowColor = rgba(cur,.9); ctx.shadowBlur = 6;
  ctx.fillStyle = rgba(lighten(cur,.35),1);
  for(let i=0;i<9;i++){
    const yy = startY + 2 + ((ts*0.26)+i*47) % (streamLen-4);
    const xx = Math.sin(ts*0.02+i*1.7)*1.2;
    ctx.beginPath(); ctx.arc(xx,yy,1.4,0,7); ctx.fill();
  }
  ctx.restore();
}

/* ========== 金属端盖 ========== */
function metalRing(y,rw,rh,h,top,mid,bot,hole){
  ctx.fillStyle = bot;
  ctx.beginPath(); ctx.ellipse(0,y+h,rw,rh,0,0,7); ctx.fill();
  const g = ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,mid); g.addColorStop(1,bot);
  ctx.fillStyle = g; ctx.fillRect(-rw,y,rw*2,h);
  ctx.fillStyle = top;
  ctx.beginPath(); ctx.ellipse(0,y,rw,rh,0,0,7); ctx.fill();
  if(hole){
    ctx.fillStyle='rgba(8,12,20,.55)';
    ctx.beginPath(); ctx.ellipse(0,y,rw-11,rh-5,0,0,7); ctx.fill();
  }
  ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.ellipse(0,y,rw,rh,0,0,7); ctx.stroke();
}
const BRASS = ['#f0d9a0','#b08d4f','#6f5426'];

/* ========== 玻璃主体 & 高光 ========== */
function glassBody(){
  const g = ctx.createLinearGradient(0,TOP,0,BOT);
  g.addColorStop(0,'rgba(255,255,255,.10)');
  g.addColorStop(.5,'rgba(255,255,255,.03)');
  g.addColorStop(1,'rgba(255,255,255,.08)');
  glassPath(); ctx.fillStyle = g; ctx.fill();
  glassPath(); ctx.fillStyle = rgba(cur,.05); ctx.fill();
}
function glassShine(){
  ctx.save(); glassPath(); ctx.clip();
  let g = ctx.createLinearGradient(-R,0,-R+40,0);
  g.addColorStop(0,'rgba(255,255,255,0)');
  g.addColorStop(.45,'rgba(255,255,255,.16)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(-R,TOP,44,BOT-TOP);
  g = ctx.createLinearGradient(R-24,0,R,0);
  g.addColorStop(0,'rgba(255,255,255,0)');
  g.addColorStop(.6,'rgba(255,255,255,.10)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(R-26,TOP,26,BOT-TOP);
  ctx.restore();
  glassPath(); ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1.6; ctx.stroke();
  glassPath(); ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=5; ctx.stroke();
}

/* ========== 主循环 ========== */
let last = performance.now();
function loop(ts){
  const dt = Math.min(.05,(ts-last)/1000); last = ts;

  if(phase==='drain'){
    if(ts-phaseStart >= DRAIN_MS){ phase='flip'; phaseStart=ts; }
  } else if(ts-phaseStart >= FLIP_MS){
    phase='drain'; phaseStart=ts;
    rotationTurns = (rotationTurns + 1) % 2;
  }

  const f = phase==='drain' ? Math.max(0, 1-(ts-phaseStart)/DRAIN_MS) : 0;
  const flipP = phase==='flip' ? Math.min(1,(ts-phaseStart)/FLIP_MS) : 0;
  const rotateP = Math.min(1, flipP / .68);
  const settleP = Math.max(0, Math.min(1, (flipP - .68) / .32));

  for(let i=0;i<3;i++) cur[i] += (target[i]-cur[i])*Math.min(1,dt*6);
  updateParticles(dt,ts);

  const breath = 1 + .02*Math.sin(ts*.0016);
  const tilt   = .055*Math.sin(ts*.0009);
  const flipAng= Math.PI * (rotationTurns + easeInOut(rotateP) * (phase==='flip' ? 1 : 0));
  const currentMirror = rotationTurns === 1;
  const nextMirror = !currentMirror;

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2, H/2);

  // 环境光晕
  let g = ctx.createRadialGradient(0,0,20,0,0,300);
  g.addColorStop(0, rgba(cur,.14)); g.addColorStop(1, rgba(cur,0));
  ctx.fillStyle = g; ctx.fillRect(-300,-320,600,640);

  // 地面投影
  g = ctx.createRadialGradient(0,272,10,0,272,160);
  g.addColorStop(0,'rgba(0,0,0,.5)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.save(); ctx.translate(0,272); ctx.scale(1,.16);
  ctx.beginPath(); ctx.arc(0,0,160,0,7); ctx.fill(); ctx.restore();

  // 整体变换
  ctx.translate(0, -26*Math.sin(Math.PI*flipP));
  ctx.rotate(tilt + flipAng);
  ctx.scale(breath, breath);

  glassBody();
  if(phase==='flip' && settleP > 0){
    drawSand(0, currentMirror, 1-settleP);
    drawSand(1, nextMirror, settleP);
  } else {
    drawSand(f, currentMirror);
  }
  drawStream(ts);
  drawParticles();
  glassShine();
  metalRing(TOP-14, R+10, 15, 12, ...BRASS, false);
  metalRing(BOT+2,  R+10, 15, 12, ...BRASS, false);

  ctx.restore();

  timerEl.textContent = phase==='drain'
    ? Math.max(0,(DRAIN_MS-(ts-phaseStart))/1000).toFixed(1)+' s'
    : '翻转中…';

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ========== 颜色切换 ========== */
function applyBtn(){
  const p = PALETTE[colorIdx];
  target = [...p.rgb];
  dot.style.background = rgba(p.rgb,1);
  dot.style.color = rgba(p.rgb,1);
  btn.querySelector('.label').textContent = '粒子特效 · ' + p.name;
  btn.style.borderColor = rgba(p.rgb,.45);
  btn.style.boxShadow = `0 0 18px ${rgba(p.rgb,.25)}`;
}
btn.addEventListener('click', ()=>{ colorIdx=(colorIdx+1)%PALETTE.length; applyBtn(); });
applyBtn();
})();
</script>
</body>
</html>
