<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>二连箭 · 命中特效</title>
<style>
  html,body{margin:0;height:100%;background:#05050a;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;

let W = 0, H = 0, DPR = 1;
let enemy = {}, bow = {}, aimAngle = 0;

/* ---------------- 状态 ---------------- */
const CYCLE  = 1.4;    // 一轮完整周期
const FIRE1  = 0.24;   // 第一箭发射时刻
const FIRE2  = 0.40;   // 第二箭发射时刻
const FLIGHT = 0.19;   // 箭矢飞行时长

let t = 0;
let firedCount = 0;
let arrows  = [];
let sparks  = [];
let rings   = [];
let shake   = 0;

/* ---------------- 尺寸 / 布局 ---------------- */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width  = Math.floor(W * DPR);
  cv.height = Math.floor(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const S = Math.min(W, H);

  enemy = {
    x: W * 0.70,
    y: H * 0.40,
    r: S * 0.135,
    flash: 0,
    knock: 0,
    kdx: 0, kdy: 0
  };

  bow = {
    x: W * 0.14,
    y: H * 0.86,
    r: S * 0.085
  };

  aimAngle = Math.atan2(enemy.y - bow.y, enemy.x - bow.x);
}

/* ---------------- 工具 ---------------- */
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);

function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

/* ---------------- 拉弓曲线 ---------------- */
function pullAt(time){
  if (time < 0.05) return 0.08;
  if (time < 0.24) return 0.08 + 0.92 * easeOutCubic((time - 0.05) / 0.19);
  if (time < 0.33) return 1 - 0.75 * easeOutCubic((time - 0.24) / 0.09);
  if (time < 0.40) return 0.25 + 0.75 * easeOutCubic((time - 0.33) / 0.07);
  if (time < 0.50) return 1 - 0.92 * easeOutCubic((time - 0.40) / 0.10);
  return 0.08;
}

/* ---------------- 发射 ---------------- */
function spawnArrow(index){
  const R = bow.r;
  const a = aimAngle;
  const cos = Math.cos(a), sin = Math.sin(a);

  // 拉满时弓弦搭箭点（局部坐标）
  const nockX = -R * 0.092 - R * 0.85;
  const sx = bow.x + nockX * cos;
  const sy = bow.y + nockX * sin;

  const tx = enemy.x + (index === 0 ? -22 :  16);
  const ty = enemy.y + (index === 0 ? -26 :  18);

  arrows.push({
    sx, sy, tx, ty,
    x: sx, y: sy,
    p: 0,
    flight: FLIGHT,
    ang: Math.atan2(ty - sy, tx - sx)
  });
}

/* ---------------- 命中 ---------------- */
function onHit(a){
  const ang = Math.atan2(a.ty - a.sy, a.tx - a.sx);

  rings.push({ x: a.tx, y: a.ty, t: 0, life: 0.42, max: 130 });
  rings.push({ x: a.tx, y: a.ty, t: 0, life: 0.26, max: 72  });

  for (let i = 0; i < 30; i++){
    const dir = ang + Math.PI + (Math.random() - 0.5) * 2.6;
    const sp  = 120 + Math.random() * 520;
    sparks.push({
      x: a.tx, y: a.ty,
      vx: Math.cos(dir) * sp,
      vy: Math.sin(dir) * sp,
      life: 0.22 + Math.random() * 0.38,
      maxLife: 0.6,
      size: 1.4 + Math.random() * 2.8,
      hue: 25 + Math.random() * 35
    });
  }
  // 几颗高亮白芯
  for (let i = 0; i < 8; i++){
    const dir = Math.random() * TAU;
    const sp  = 200 + Math.random() * 620;
    sparks.push({
      x: a.tx, y: a.ty,
      vx: Math.cos(dir) * sp,
      vy: Math.sin(dir) * sp,
      life: 0.12 + Math.random() * 0.18,
      maxLife: 0.3,
      size: 1.2 + Math.random() * 1.8,
      hue: 55
    });
  }

  shake = Math.min(24, shake + 13);

  enemy.flash = 1;
  enemy.knock = Math.min(34, enemy.knock + 20);
  enemy.kdx = Math.cos(ang);
  enemy.kdy = Math.sin(ang);
}

/* ---------------- 更新 ---------------- */
function update(dt){
  t += dt;
  if (t >= CYCLE){
    t -= CYCLE;
    firedCount = 0;
    arrows.length = 0;
  }

  if (firedCount < 1 && t >= FIRE1){ firedCount = 1; spawnArrow(0); }
  else if (firedCount < 2 && t >= FIRE2){ firedCount = 2; spawnArrow(1); }

  // 箭矢
  for (let i = arrows.length - 1; i >= 0; i--){
    const a = arrows[i];
    a.p += dt / a.flight;
    if (a.p >= 1){
      a.x = a.tx; a.y = a.ty;
      onHit(a);
      arrows.splice(i, 1);
      continue;
    }
    a.x = a.sx + (a.tx - a.sx) * a.p;
    a.y = a.sy + (a.ty - a.sy) * a.p;
  }

  // 粒子
  for (let i = sparks.length - 1; i >= 0; i--){
    const p = sparks[i];
    p.life -= dt;
    if (p.life <= 0){ sparks.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const damp = Math.pow(0.02, dt);
    p.vx *= damp;
    p.vy *= damp;
    p.vy += 320 * dt;
  }

  // 冲击环
  for (let i = rings.length - 1; i >= 0; i--){
    const r = rings[i];
    r.t += dt;
    if (r.t >= r.life) rings.splice(i, 1);
  }

  // 衰减
  enemy.flash = Math.max(0, enemy.flash - dt * 4.2);
  enemy.knock *= Math.pow(0.00008, dt);
  if (enemy.knock < 0.1) enemy.knock = 0;

  shake -= shake * 13 * dt;
  if (shake < 0.35) shake = 0;
}

/* ---------------- 绘制：背景 ---------------- */
function drawBackground(){
  ctx.fillStyle = '#06060c';
  ctx.fillRect(0, 0, W, H);

  const g = ctx.createRadialGradient(W * 0.66, H * 0.38, 0, W * 0.66, H * 0.38, Math.max(W, H) * 0.85);
  g.addColorStop(0,    'rgba(72,46,110,0.55)');
  g.addColorStop(0.45, 'rgba(28,20,46,0.42)');
  g.addColorStop(1,    'rgba(5,5,10,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 地面冷光
  const gg = ctx.createLinearGradient(0, H * 0.72, 0, H);
  gg.addColorStop(0, 'rgba(40,28,70,0)');
  gg.addColorStop(1, 'rgba(60,40,110,0.28)');
  ctx.fillStyle = gg;
  ctx.fillRect(0, H * 0.7, W, H * 0.3);
}

/* ---------------- 绘制：敌人 ---------------- */
function drawEnemyShadow(){
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.beginPath();
  ctx.ellipse(enemy.x, enemy.y + enemy.r * 1.02, enemy.r * 0.95, enemy.r * 0.2, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawEnemy(){
  const R = enemy.r;
  const s = R / 100;
  const kx = enemy.knock * enemy.kdx;
  const ky = enemy.knock * enemy.kdy;
  const bob = Math.sin(performance.now() / 720) * 3;
  const flash = enemy.flash;

  ctx.save();
  ctx.translate(enemy.x + kx, enemy.y + ky + bob);
  ctx.scale(s, s);

  // 腿
  ctx.fillStyle = '#241a30';
  rr(-46, 40, 34, 62, 14); ctx.fill();
  rr( 12, 40, 34, 62, 14); ctx.fill();

  // 手臂
  ctx.strokeStyle = '#2c2038';
  ctx.lineWidth = 30;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-52, -32); ctx.lineTo(-84, 34); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 52, -32); ctx.lineTo( 84, 34); ctx.stroke();

  // 爪
  ctx.fillStyle = '#4a3a58';
  ctx.beginPath(); ctx.arc(-86, 40, 17, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc( 86, 40, 17, 0, TAU); ctx.fill();

  // 躯干
  const bodyGrad = ctx.createLinearGradient(0, -70, 0, 95);
  bodyGrad.addColorStop(0, '#4d3660');
  bodyGrad.addColorStop(1, '#211728');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(-60, 60);
  ctx.bezierCurveTo(-82, -8, -62, -62, 0, -62);
  ctx.bezierCurveTo( 62, -62,  82, -8, 60, 60);
  ctx.bezierCurveTo( 32, 80, -32, 80, -60, 60);
  ctx.closePath();
  ctx.fill();

  // 胸口符文
  ctx.save();
  ctx.strokeStyle = 'rgba(255,86,86,0.6)';
  ctx.shadowColor = '#ff4040';
  ctx.shadowBlur = 14;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, -32); ctx.lineTo(0, 32);
  ctx.moveTo(-20, -2); ctx.lineTo(20, -2);
  ctx.stroke();
  ctx.restore();

  // 脖子
  ctx.fillStyle = '#2a1e36';
  ctx.beginPath(); ctx.ellipse(0, -72, 26, 18, 0, 0, TAU); ctx.fill();

  // 头
  const headGrad = ctx.createRadialGradient(-22, -134, 8, 0, -112, 84);
  headGrad.addColorStop(0, '#5d4474');
  headGrad.addColorStop(1, '#2c203e');
  ctx.fillStyle = headGrad;
  ctx.beginPath(); ctx.arc(0, -112, 62, 0, TAU); ctx.fill();

  // 犄角
  ctx.strokeStyle = '#c8b6a0';
  ctx.lineWidth = 13;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-42, -150); ctx.quadraticCurveTo(-88, -196, -60, -230); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 42, -150); ctx.quadraticCurveTo( 88, -196,  60, -230); ctx.stroke();

  // 眼睛
  ctx.save();
  ctx.shadowColor = '#ff2b2b';
  ctx.shadowBlur = 28;
  ctx.fillStyle = '#ff5a5a';
  ctx.beginPath(); ctx.ellipse(-25, -118, 14, 9, -0.22, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 25, -118, 14, 9,  0.22, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#180000';
  ctx.beginPath(); ctx.ellipse(-25, -118, 4, 7, -0.22, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 25, -118, 4, 7,  0.22, 0, TAU); ctx.fill();

  // 嘴
  ctx.fillStyle = '#12060e';
  ctx.beginPath();
  ctx.moveTo(-30, -86);
  ctx.quadraticCurveTo(0, -66, 30, -86);
  ctx.quadraticCurveTo(0, -78, -30, -86);
  ctx.closePath();
  ctx.fill();

  // 獠牙
  ctx.fillStyle = '#e8dcc8';
  for (let i = -2; i <= 2; i++){
    const x = i * 11;
    ctx.beginPath();
    ctx.moveTo(x - 5, -84);
    ctx.lineTo(x,     -71);
    ctx.lineTo(x + 5, -84);
    ctx.closePath();
    ctx.fill();
  }

  // 受击闪光
  if (flash > 0.01){
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.min(1, flash) * 0.9;
    const g = ctx.createRadialGradient(0, -40, 8, 0, -40, 195);
    g.addColorStop(0,   'rgba(255,240,210,0.95)');
    g.addColorStop(0.35,'rgba(255,150,70,0.55)');
    g.addColorStop(1,   'rgba(255,60,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -40, 195, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

/* ---------------- 绘制：弓 ---------------- */
function drawBow(){
  const R = bow.r;
  const a = aimAngle;
  const pull = pullAt(t);

  ctx.save();
  ctx.translate(bow.x, bow.y);
  ctx.rotate(a);

  const tipX = -R * 0.092;
  const tipY =  R * 0.912;
  const nockX = tipX - pull * R * 0.85;

  // 弓臂
  ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(255,200,110,' + (0.45 + pull * 0.55) + ')';
  ctx.shadowBlur = 12 + pull * 28;
  ctx.strokeStyle = '#b98b2e';
  ctx.lineWidth = R * 0.15;
  ctx.beginPath();
  ctx.arc(-R * 0.5, 0, R, -1.15, 1.15);
  ctx.stroke();

  // 弓臂高光
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,238,190,0.65)';
  ctx.lineWidth = Math.max(1, R * 0.045);
  ctx.beginPath();
  ctx.arc(-R * 0.5, 0, R * 0.97, -0.95, 0.95);
  ctx.stroke();

  // 弓弦
  ctx.strokeStyle = 'rgba(200,230,255,0.8)';
  ctx.lineWidth = Math.max(1.1, R * 0.03);
  ctx.beginPath();
  ctx.moveTo(tipX, -tipY);
  ctx.lineTo(nockX, 0);
  ctx.lineTo(tipX,  tipY);
  ctx.stroke();

  // 蓄力辉光 + 搭箭
  if (pull > 0.35 && firedCount < 2){
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(nockX, 0, 0, nockX, 0, R * 1.15);
    g.addColorStop(0,   'rgba(255,245,200,0.9)');
    g.addColorStop(0.38,'rgba(255,175,70,0.45)');
    g.addColorStop(1,   'rgba(255,120,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(nockX, 0, R * 1.15, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    // 待发箭矢
    ctx.shadowColor = '#8ceaff';
    ctx.shadowBlur = 12;
    ctx.strokeStyle = '#e6faff';
    ctx.lineWidth = Math.max(1.6, R * 0.045);
    ctx.beginPath();
    ctx.moveTo(nockX, 0);
    ctx.lineTo(nockX + R * 1.5, 0);
    ctx.stroke();

    ctx.fillStyle = '#cdf3ff';
    ctx.beginPath();
    ctx.moveTo(nockX + R * 1.62, 0);
    ctx.lineTo(nockX + R * 1.42, -R * 0.11);
    ctx.lineTo(nockX + R * 1.42,  R * 0.11);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

/* ---------------- 绘制：箭矢 ---------------- */
function drawArrows(){
  for (const a of arrows){
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.ang);

    // 拖尾
    const len = 110;
    const g = ctx.createLinearGradient(-len, 0, 0, 0);
    g.addColorStop(0,   'rgba(110,215,255,0)');
    g.addColorStop(0.55,'rgba(150,232,255,0.35)');
    g.addColorStop(1,   'rgba(225,250,255,0.95)');
    ctx.strokeStyle = g;
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-len, 0); ctx.lineTo(0, 0); ctx.stroke();

    // 箭杆
    ctx.shadowColor = '#7de9ff';
    ctx.shadowBlur = 16;
    ctx.strokeStyle = '#f2fcff';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(4, 0); ctx.stroke();

    // 箭头
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(17, 0);
    ctx.lineTo(-3, -7.5);
    ctx.lineTo(-3,  7.5);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }
}

/* ---------------- 绘制：冲击环 ---------------- */
function drawRings(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const r of rings){
    const p = r.t / r.life;
    const rad = 10 + p * r.max;
    const alpha = (1 - p) * (1 - p);

    ctx.strokeStyle = `rgba(255,215,150,${alpha})`;
    ctx.lineWidth = 9 * (1 - p) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke();

    ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.85})`;
    ctx.lineWidth = 3.2 * (1 - p) + 0.6;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad * 0.68, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

/* ---------------- 绘制：火花 ---------------- */
function drawSparks(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const p of sparks){
    const alpha = Math.max(0, p.life / p.maxLife);
    const col = `hsla(${p.hue}, 100%, ${58 + alpha * 35}%, ${alpha})`;

    ctx.strokeStyle = col;
    ctx.lineWidth = p.size * (0.5 + alpha * 0.6);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * 0.022, p.y - p.vy * 0.022);
    ctx.stroke();

    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (0.35 + alpha * 0.55), 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

/* ---------------- 绘制：暗角 ---------------- */
function drawVignette(){
  const g = ctx.createRadialGradient(
    W / 2, H / 2, Math.min(W, H) * 0.32,
    W / 2, H / 2, Math.max(W, H) * 0.78
  );
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.78)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ---------------- 渲染 ---------------- */
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();

  ctx.save();
  if (shake > 0.35){
    ctx.translate(
      (Math.random() - 0.5) * shake,
      (Math.random() - 0.5) * shake
    );
  }

  drawEnemyShadow();
  drawEnemy();
  drawRings();
  drawSparks();
  drawBow();
  drawArrows();

  ctx.restore();

  drawVignette();
}

/* ---------------- 主循环 ---------------- */
let lastT = performance.now();
function loop(now){
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;   // 防止切后台后跳帧
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ---------------- 启动 ---------------- */
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
