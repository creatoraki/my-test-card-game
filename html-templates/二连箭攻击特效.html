<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>二连箭命中特效</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070b12;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }
  .hint {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    font: 12px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: rgba(220,235,255,.5);
    letter-spacing: .08em;
    user-select: none;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">点击画面可重新播放「二连箭」</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  let startTime = performance.now();

  const rand = (a,b) => a + Math.random()*(b-a);
  const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
  const easeOutCubic = t => 1 - Math.pow(1-t, 3);
  const easeInCubic  = t => t*t*t;
  const easeOutBack = t => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2);
  };

  const sparks = [];
  const rings = [];
  const dust = [];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth;
    H = innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);

    dust.length = 0;
    for (let i=0;i<70;i++) {
      dust.push({
        x: Math.random()*W,
        y: Math.random()*H,
        r: rand(.4,1.5),
        a: rand(.03,.16),
        s: rand(.05,.22)
      });
    }
  }
  addEventListener('resize', resize);
  resize();

  function replay() {
    startTime = performance.now();
    sparks.length = 0;
    rings.length = 0;
  }
  canvas.addEventListener('click', replay);

  function bg(t) {
    const g = ctx.createRadialGradient(W*.5,H*.42,10,W*.5,H*.48,Math.max(W,H)*.7);
    g.addColorStop(0, '#152338');
    g.addColorStop(.42, '#0b1220');
    g.addColorStop(1, '#05070c');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // subtle ground haze
    const hg = ctx.createLinearGradient(0,H*.45,0,H);
    hg.addColorStop(0,'rgba(40,70,105,0)');
    hg.addColorStop(1,'rgba(50,80,115,.12)');
    ctx.fillStyle = hg;
    ctx.fillRect(0,H*.45,W,H*.55);

    // horizon bloom
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = 'rgba(50,95,145,.06)';
    ctx.beginPath();
    ctx.ellipse(W*.5,H*.58,W*.34,H*.06,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    // particles
    for (const p of dust) {
      p.y -= p.s;
      if (p.y < -3) p.y = H+3;
      ctx.fillStyle = `rgba(170,205,235,${p.a})`;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
    }

    // vignette
    const vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.72);
    vg.addColorStop(.55,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(0,0,0,.62)');
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,W,H);
  }

  function enemyPose(t) {
    // Hit moments around 740ms and 1040ms
    const hit1 = clamp((t-740)/210,0,1);
    const hit2 = clamp((t-1040)/260,0,1);

    let kick = 0;
    if (t >= 740 && t < 950) {
      const u = (t-740)/210;
      kick += Math.sin(u*Math.PI) * 12;
    }
    if (t >= 1040 && t < 1320) {
      const u = (t-1040)/280;
      kick += Math.sin(u*Math.PI) * 18;
    }

    let shake = 0;
    if (t>740 && t<1320) {
      const amp = t<1040 ? 3.5 : 6;
      shake = Math.sin(t*.09)*amp*(1-clamp((t-740)/620,0,1));
    }

    return { kick, shake, hit1, hit2 };
  }

  function drawEnemy(t) {
    const cx = W*.5;
    const baseY = H*.72;
    const scale = Math.min(W,H)/720;
    const p = enemyPose(t);

    ctx.save();
    ctx.translate(cx + p.shake, baseY + p.kick);
    ctx.scale(scale, scale);

    // recoil backward around waist
    const recoil = (p.hit1*.035 + p.hit2*.05);
    ctx.rotate(-recoil);

    // shadow
    ctx.save();
    ctx.scale(1, .34);
    const sg = ctx.createRadialGradient(0,0,20,0,0,150);
    sg.addColorStop(0,'rgba(0,0,0,.55)');
    sg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(0,95,150,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    // legs
    ctx.lineCap = 'round';
    ctx.lineWidth = 34;
    ctx.strokeStyle = '#17202c';
    ctx.beginPath();
    ctx.moveTo(-34,0); ctx.lineTo(-44,145);
    ctx.moveTo(34,0);  ctx.lineTo(44,145);
    ctx.stroke();

    // boots
    ctx.strokeStyle = '#101720';
    ctx.lineWidth = 24;
    ctx.beginPath();
    ctx.moveTo(-44,135); ctx.lineTo(-51,165);
    ctx.moveTo(44,135);  ctx.lineTo(51,165);
    ctx.stroke();

    // torso
    const body = ctx.createLinearGradient(-90,-190,90,70);
    body.addColorStop(0,'#2b3543');
    body.addColorStop(.55,'#1c2633');
    body.addColorStop(1,'#111923');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(-76,-186);
    ctx.quadraticCurveTo(-104,-120,-82,-20);
    ctx.quadraticCurveTo(-60,42,0,52);
    ctx.quadraticCurveTo(60,42,82,-20);
    ctx.quadraticCurveTo(104,-120,76,-186);
    ctx.quadraticCurveTo(0,-220,-76,-186);
    ctx.closePath();
    ctx.fill();

    // chest armor plates
    ctx.strokeStyle = 'rgba(120,150,180,.25)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-58,-160); ctx.lineTo(0,-118); ctx.lineTo(58,-160);
    ctx.moveTo(0,-118); ctx.lineTo(0,-25);
    ctx.stroke();

    ctx.fillStyle = 'rgba(55,79,101,.52)';
    ctx.beginPath();
    ctx.moveTo(-62,-151); ctx.lineTo(-8,-115); ctx.lineTo(-12,-57); ctx.lineTo(-61,-80); ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(62,-151); ctx.lineTo(8,-115); ctx.lineTo(12,-57); ctx.lineTo(61,-80); ctx.closePath();
    ctx.fill();

    // arms relaxed, front-facing
    ctx.strokeStyle = '#1a2430';
    ctx.lineWidth = 36;
    ctx.beginPath();
    ctx.moveTo(-77,-160); ctx.lineTo(-108,-72); ctx.lineTo(-102,15);
    ctx.moveTo(77,-160);  ctx.lineTo(108,-72);  ctx.lineTo(102,15);
    ctx.stroke();

    // shoulder guards
    ctx.fillStyle = '#344253';
    for (const s of [-1,1]) {
      ctx.save();
      ctx.scale(s,1);
      ctx.beginPath();
      ctx.moveTo(55,-184);
      ctx.quadraticCurveTo(92,-195,109,-160);
      ctx.lineTo(90,-128);
      ctx.lineTo(62,-144);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // neck
    ctx.fillStyle = '#707986';
    ctx.fillRect(-18,-220,36,40);

    // head
    const headG = ctx.createLinearGradient(-35,-286,35,-210);
    headG.addColorStop(0,'#7b8794');
    headG.addColorStop(1,'#4d5966');
    ctx.fillStyle = headG;
    ctx.beginPath();
    ctx.ellipse(0,-253,43,51,0,0,Math.PI*2);
    ctx.fill();

    // hood/helmet
    ctx.fillStyle = '#1a2430';
    ctx.beginPath();
    ctx.arc(0,-261,45,Math.PI,Math.PI*2);
    ctx.lineTo(40,-240);
    ctx.quadraticCurveTo(0,-216,-40,-240);
    ctx.closePath();
    ctx.fill();

    // face shadow + eyes toward player
    ctx.fillStyle = 'rgba(5,8,12,.64)';
    ctx.fillRect(-31,-261,62,22);
    ctx.fillStyle = 'rgba(170,210,255,.82)';
    ctx.fillRect(-21,-252,11,2.4);
    ctx.fillRect(10,-252,11,2.4);

    // impact glow on chest
    const glowA = Math.max(
      0,
      t>740 && t<930 ? 1-(t-740)/190 : 0,
      t>1040 && t<1240 ? 1-(t-1040)/200 : 0
    );
    if (glowA > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const gg = ctx.createRadialGradient(0,-92,3,0,-92,78);
      gg.addColorStop(0,`rgba(220,245,255,${.9*glowA})`);
      gg.addColorStop(.15,`rgba(80,190,255,${.65*glowA})`);
      gg.addColorStop(1,'rgba(40,120,255,0)');
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.arc(0,-92,80,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();

    // Enemy rim light
    ctx.save();
    ctx.globalCompositeOperation='screen';
    const rg = ctx.createRadialGradient(cx,baseY-170*scale,20,cx,baseY-170*scale,220*scale);
    rg.addColorStop(0,'rgba(80,145,200,.06)');
    rg.addColorStop(1,'rgba(80,145,200,0)');
    ctx.fillStyle=rg;
    ctx.beginPath();
    ctx.arc(cx,baseY-170*scale,220*scale,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    return {
      chestX: cx + p.shake,
      chestY: baseY + p.kick - 92*scale
    };
  }

  function arrowState(t, delay, side) {
    const dur = 300;
    const p = clamp((t-delay)/dur,0,1);
    const active = t>=delay && t<=delay+dur+120;
    const e = easeInCubic(p);
    const sx = W*.5 + side*Math.min(110,W*.11);
    const sy = H*1.02;
    const tx = W*.5 + side*8;
    const ty = H*.72 - 92*(Math.min(W,H)/720);
    const x = sx + (tx-sx)*e;
    const y = sy + (ty-sy)*e;
    return {p,active,x,y,sx,sy,tx,ty,delay,dur};
  }

  function drawArrow(a, side, t) {
    if (!a.active) return;
    const dx = a.tx-a.sx, dy = a.ty-a.sy;
    const ang = Math.atan2(dy,dx);
    const speedScale = .35 + a.p*1.25;

    ctx.save();
    ctx.translate(a.x,a.y);
    ctx.rotate(ang);

    // trail
    ctx.save();
    ctx.globalCompositeOperation='screen';
    const trailLen = 110 + 300*a.p;
    const tg = ctx.createLinearGradient(-trailLen,0,10,0);
    tg.addColorStop(0,'rgba(30,120,255,0)');
    tg.addColorStop(.58,'rgba(55,145,255,.12)');
    tg.addColorStop(1,'rgba(160,225,255,.82)');
    ctx.strokeStyle=tg;
    ctx.lineWidth=2.2 + 2*a.p;
    ctx.beginPath();
    ctx.moveTo(-trailLen,0);
    ctx.lineTo(8,0);
    ctx.stroke();

    // secondary streaks
    ctx.globalAlpha=.4;
    for(let i=0;i<3;i++){
      ctx.strokeStyle='rgba(70,170,255,.5)';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(-rand(80,190), rand(-9,9));
      ctx.lineTo(-rand(8,40), rand(-3,3));
      ctx.stroke();
    }
    ctx.restore();

    // shaft
    ctx.strokeStyle='#c9d7e5';
    ctx.lineWidth=2.4*speedScale;
    ctx.beginPath();
    ctx.moveTo(-34*speedScale,0);
    ctx.lineTo(18*speedScale,0);
    ctx.stroke();

    // tip
    ctx.fillStyle='#f2fbff';
    ctx.beginPath();
    ctx.moveTo(25*speedScale,0);
    ctx.lineTo(15*speedScale,-4.2*speedScale);
    ctx.lineTo(15*speedScale,4.2*speedScale);
    ctx.closePath();
    ctx.fill();

    // fletching
    ctx.fillStyle='rgba(85,170,255,.95)';
    ctx.beginPath();
    ctx.moveTo(-30*speedScale,0);
    ctx.lineTo(-42*speedScale,-6*speedScale);
    ctx.lineTo(-37*speedScale,0);
    ctx.lineTo(-42*speedScale,6*speedScale);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    // speed bloom near arrow head
    ctx.save();
    ctx.globalCompositeOperation='screen';
    const rg=ctx.createRadialGradient(a.x,a.y,0,a.x,a.y,28+30*a.p);
    rg.addColorStop(0,'rgba(190,235,255,.5)');
    rg.addColorStop(1,'rgba(40,140,255,0)');
    ctx.fillStyle=rg;
    ctx.beginPath();
    ctx.arc(a.x,a.y,28+30*a.p,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function impact(x,y,intensity=1) {
    rings.push({x,y,born:performance.now(),life:260,intensity});
    for(let i=0;i<16*intensity;i++){
      const a=Math.random()*Math.PI*2;
      const sp=rand(90,280)*intensity;
      sparks.push({
        x,y,
        vx:Math.cos(a)*sp,
        vy:Math.sin(a)*sp,
        born:performance.now(),
        life:rand(180,420),
        len:rand(8,24)
      });
    }
  }

  let fired1=false, fired2=false;
  function updateImpacts(t, chest) {
    if (t<100) { fired1=false; fired2=false; }
    if (!fired1 && t>=740) {
      fired1=true;
      impact(chest.chestX-8,chest.chestY,1);
    }
    if (!fired2 && t>=1040) {
      fired2=true;
      impact(chest.chestX+8,chest.chestY-2,1.35);
    }
  }

  function drawEffects(now) {
    ctx.save();
    ctx.globalCompositeOperation='screen';

    for (let i=rings.length-1;i>=0;i--) {
      const r=rings[i], age=now-r.born;
      if(age>r.life){rings.splice(i,1);continue;}
      const p=age/r.life;
      const rr=10 + easeOutCubic(p)*80*r.intensity;
      ctx.strokeStyle=`rgba(100,195,255,${(1-p)*.65})`;
      ctx.lineWidth=(1-p)*5+1;
      ctx.beginPath();
      ctx.arc(r.x,r.y,rr,0,Math.PI*2);
      ctx.stroke();

      const g=ctx.createRadialGradient(r.x,r.y,0,r.x,r.y,45*r.intensity);
      g.addColorStop(0,`rgba(230,250,255,${(1-p)*.9})`);
      g.addColorStop(.15,`rgba(80,190,255,${(1-p)*.72})`);
      g.addColorStop(1,'rgba(40,120,255,0)');
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.arc(r.x,r.y,45*r.intensity,0,Math.PI*2);
      ctx.fill();
    }

    for (let i=sparks.length-1;i>=0;i--) {
      const s=sparks[i], age=now-s.born;
      if(age>s.life){sparks.splice(i,1);continue;}
      const p=age/s.life;
      const dt=age/1000;
      const x=s.x+s.vx*dt;
      const y=s.y+s.vy*dt+120*dt*dt;
      const mag=Math.hypot(s.vx,s.vy)||1;
      const nx=s.vx/mag, ny=s.vy/mag;
      ctx.strokeStyle=`rgba(165,225,255,${(1-p)*.9})`;
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x-nx*s.len*(1-p),y-ny*s.len*(1-p));
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawEmbeddedArrows(t) {
    const scale = Math.min(W,H)/720;
    const baseY = H*.72;
    const cx = W*.5;
    const p = enemyPose(t);

    const shots = [
      {hit:740, side:-1, y:-96*scale},
      {hit:1040, side:1, y:-88*scale}
    ];

    for(const sh of shots){
      if(t<sh.hit) continue;
      const age=t-sh.hit;
      const fade = t>1750 ? 1-clamp((t-1750)/500,0,1) : 1;
      const wiggle = Math.sin(age*.06)*Math.max(0,1-age/220)*0.06;
      ctx.save();
      ctx.globalAlpha=fade;
      ctx.translate(cx+p.shake+sh.side*7, baseY+p.kick+sh.y);
      ctx.rotate(-Math.PI/2 + sh.side*.03 + wiggle);

      // shaft protruding toward viewer
      const len=58*scale;
      ctx.strokeStyle='#cbd8e6';
      ctx.lineWidth=Math.max(1.3,2.4*scale);
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.lineTo(0,len);
      ctx.stroke();

      ctx.fillStyle='rgba(75,165,255,.95)';
      ctx.beginPath();
      ctx.moveTo(0,len);
      ctx.lineTo(-7*scale,len+13*scale);
      ctx.lineTo(0,len+9*scale);
      ctx.lineTo(7*scale,len+13*scale);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function drawFlash(t) {
    // slight screen flash on second hit
    let a=0;
    if(t>=1040 && t<1110) a=(1-(t-1040)/70)*.16;
    if(a>0){
      ctx.fillStyle=`rgba(180,225,255,${a})`;
      ctx.fillRect(0,0,W,H);
    }
  }

  function loop(now) {
    let t=(now-startTime)%2600;
    bg(t);

    const enemy = drawEnemy(t);
    updateImpacts(t, enemy);

    // arrows: first at 440ms, second at 700ms
    const a1=arrowState(t,440,-1);
    const a2=arrowState(t,700,1);

    drawArrow(a1,-1,t);
    drawArrow(a2,1,t);
    drawEmbeddedArrows(t);
    drawEffects(now);
    drawFlash(t);

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
