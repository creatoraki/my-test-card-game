<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天赋树 · 卡牌游戏</title>
    <style>
        :root {
            --bg: #08080f;
            --bg2: #0d0d1a;
            --gold: #ffd700;
            --text: #e8e0d0;
            --text-dim: #887e6a;
            --tooltip-bg: rgba(15, 12, 25, 0.95);
            --tooltip-border: rgba(255, 215, 0, 0.4);
            --shadow-glow: 0 0 40px rgba(255, 200, 80, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at center, var(--bg2) 0%, var(--bg) 70%, #050508 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', 'Palatino Linotype', 'Book Antiqua', serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
            position: relative;
        }

        /* 背景粒子层 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 220, 150, 0.8) 0%, rgba(255, 180, 80, 0.3) 40%, transparent 70%);
            animation: floatParticle linear infinite;
            opacity: 0;
        }
        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) translateX(0) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-10vh) translateX(40px) scale(1.2);
                opacity: 0;
            }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            width: 1200px;
            max-width: 95vw;
            aspect-ratio: 3/2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SVG画布 */
        #talent-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 30px rgba(255, 200, 100, 0.15));
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 树枝路径样式 */
        .branch-path {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 节点组 - 悬浮仅增强发光，不改变尺寸，避免抖动 */
        .node-group {
            cursor: pointer;
            transition: filter 0.3s ease, opacity 0.3s ease;
            pointer-events: all;
        }
        .node-group:hover {
            filter: brightness(1.6) drop-shadow(0 0 25px rgba(255, 255, 220, 0.9));
        }

        /* 节点状态：未激活灰色无光，激活后点亮 */
        .node-group .node-outer {
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .node-group .node-main {
            fill: #3f3f4a;
            opacity: 0.65;
            transition: fill 0.35s ease, opacity 0.35s ease;
        }
        .node-group .node-color {
            fill: #55555f;
            opacity: 0.8;
            stroke: rgba(255, 255, 255, 0.15);
            transition: fill 0.35s ease, opacity 0.35s ease, stroke 0.35s ease, stroke-width 0.35s ease;
        }
        .node-group .node-icon {
            fill: #8f8f98;
            opacity: 0.7;
            transition: fill 0.35s ease, opacity 0.35s ease;
        }
        .node-group .node-inner {
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .node-group:not(.activated) .node-pulse-ring {
            animation: none;
            opacity: 0;
        }
        /* 未激活节点悬浮仅轻微提亮，不发光 */
        .node-group:not(.activated):hover {
            filter: brightness(1.25);
        }
        .node-group.activated {
            filter: brightness(1.25) drop-shadow(0 0 16px rgba(255, 215, 0, 0.8));
        }
        .node-group.activated .node-main {
            fill: url(#coreInnerGlow);
            opacity: 0.5;
        }
        .node-group.activated .node-color {
            fill: var(--node-color, #ffd166);
            opacity: 1;
            stroke: #ffd700;
            stroke-width: 2.5;
        }
        .node-group.activated .node-icon {
            fill: #fff;
            opacity: 1;
        }
        .node-group.activated .node-outer {
            opacity: 0.55;
        }
        .node-group.activated .node-inner {
            opacity: 0.85;
        }
        .node-group.activated:hover {
            filter: brightness(1.6) drop-shadow(0 0 22px rgba(255, 255, 220, 0.95));
        }

        /* 核心节点 */
        .core-node {
            cursor: pointer;
            transition: filter 0.4s ease;
            pointer-events: all;
        }
        .core-node:hover {
            filter: brightness(1.4) drop-shadow(0 0 40px rgba(255, 215, 0, 0.9));
        }
        .core-node:active {
            filter: brightness(0.8);
        }

        /* 节点光环动画 */
        @keyframes pulseRing {
            0% {
                r: 22;
                opacity: 0.8;
            }
            100% {
                r: 38;
                opacity: 0;
            }
        }
        .node-pulse-ring {
            animation: pulseRing 2.4s ease-out infinite;
            pointer-events: none;
        }
        .core-pulse-ring {
            animation: pulseRing 3s ease-out infinite;
            pointer-events: none;
        }

        /* 流动光点 */
        .flow-orb {
            pointer-events: none;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.9));
        }

        /* 悬浮提示 */
        .tooltip {
            position: fixed;
            z-index: 100;
            background: var(--tooltip-bg);
            border: 1.5px solid var(--tooltip-border);
            border-radius: 16px;
            padding: 18px 22px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(8px) scale(0.92);
            transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(255, 200, 100, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-width: 320px;
            min-width: 220px;
            will-change: left, top, transform, opacity;
        }
        .tooltip.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .tooltip::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 12px;
            height: 12px;
            background: var(--tooltip-bg);
            border-left: 1.5px solid var(--tooltip-border);
            border-top: 1.5px solid var(--tooltip-border);
        }
        .tooltip-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .tooltip-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(255, 200, 100, 0.3);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
        }
        .tooltip-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text);
            letter-spacing: 0.5px;
        }
        .tooltip-tier {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 2px;
        }
        .tooltip-effect {
            font-size: 13px;
            color: #b8a88a;
            line-height: 1.5;
            margin-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 10px;
        }
        .tooltip-value {
            font-size: 15px;
            font-weight: bold;
            color: #ffd700;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        /* 右上角天赋点计数器 */
        .talent-counter {
            position: fixed;
            top: 28px;
            right: 32px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 22px;
            background: rgba(15, 12, 25, 0.85);
            border: 1.5px solid rgba(255, 215, 0, 0.35);
            border-radius: 999px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(255, 200, 100, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            pointer-events: none;
            font-family: 'Georgia', serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .talent-counter .counter-label {
            font-size: 13px;
            color: var(--text-dim);
            letter-spacing: 2px;
        }
        .talent-counter .counter-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
        }
        .talent-counter .counter-value.bump {
            animation: counterBump 0.35s ease;
        }
        @keyframes counterBump {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.25);
                color: #fff3c4;
            }
            100% {
                transform: scale(1);
            }
        }

        /* 底部提示 */
        .hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 220, 160, 0.5);
            font-size: 13px;
            letter-spacing: 2px;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.5s;
            font-family: 'Georgia', serif;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                max-width: 100vw;
                aspect-ratio: 4/5;
            }
            .hint {
                font-size: 11px;
                bottom: 16px;
            }
            .tooltip {
                max-width: 240px;
                padding: 14px 16px;
                font-size: 12px;
            }
            .talent-counter {
                top: 16px;
                right: 16px;
                padding: 8px 16px;
                gap: 10px;
            }
            .talent-counter .counter-value {
                font-size: 16px;
            }
        }
        @media (max-width: 480px) {
            .container {
                max-width: 100vw;
                aspect-ratio: 3/4;
            }
        }
    </style>
</head>

                { id: 'hand-limit', name: '手牌上限', icon: 'handLimit', color: '#55cc66', colorDark: '#338822',
                    gradient: 'branchGrad-nature',
                    nodes: [
                        { name: '扩充牌匣', icon: 'handLimit', tier: 1, effect: '让手中可以容纳更多卡牌', value: '手牌上限 +1' },
                        { name: '并行计划', icon: 'handLimit', tier: 2, effect: '同时保留更多不同的行动方案', value: '手牌上限 +2' },
                        { name: '宽裕编排', icon: 'handLimit', tier: 3, effect: '减少满手牌带来的决策压力', value: '手牌上限 +3' },
                        { name: '无限牌匣', icon: 'handLimit', tier: 4, effect: '让牌组拥有充足的战术储备', value: '手牌上限 +4' },
                    ]
                },
            ];

            const currentCore = CORE_TALENT;
            let flowOrbAnimFrame = null;
            let flowOrbs = [];
            // 已激活节点集合，key 格式：分支id-节点下标
            const activatedNodes = new Set();

            const svg = document.getElementById('talent-svg');
            const branchesContainer = document.getElementById('branches-container');
            const flowOrbsContainer = document.getElementById('flow-orbs-container');
            const nodesContainer = document.getElementById('nodes-container');
            const coreContainer = document.getElementById('core-container');
            const decorContainer = document.getElementById('decor-container');
            const tooltip = document.getElementById('tooltip');
            const tooltipIcon = document.getElementById('tooltip-icon');
            const tooltipTitle = document.getElementById('tooltip-title');
            const tooltipTier = document.getElementById('tooltip-tier');
            const tooltipEffect = document.getElementById('tooltip-effect');
            const tooltipValue = document.getElementById('tooltip-value');
            const hint = document.getElementById('hint');
            const particlesContainer = document.getElementById('particles');
            const talentUsed = document.getElementById('talent-used');
            const talentTotal = document.getElementById('talent-total');
            const counterValue = document.getElementById('counter-value');

            function createParticles() {
                for (let i = 0; i < 60; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const size = 2 + Math.random() * 5;
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.animationDuration = (8 + Math.random() * 20) + 's';
                    p.style.animationDelay = (Math.random() * 20) + 's';
                    p.style.opacity = '0';
                    particlesContainer.appendChild(p);
                }
            }
            createParticles();

            function degToRad(deg) { return deg * Math.PI / 180; }

            function computeBranchGeometry(angleDeg, curveOffset, length, spread, nodeCount) {
                const angle = degToRad(angleDeg);
                const spreadAdjusted = length * spread;
                const dirX = Math.cos(angle);
                const dirY = Math.sin(angle);
                const perpX = -Math.sin(angle);
                const perpY = Math.cos(angle);

                const pointCount = nodeCount + 2;
                const firstNodeProgress = 0.45;
                const bendDirection = curveOffset < 0 ? -1 : 1;
                const bendOffset = Math.max(Math.abs(curveOffset), 0.06) * spreadAdjusted;
                const points = Array.from({ length: pointCount }, (_, pointIndex) => {
                    const t = pointIndex === 0
                        ? 0
                        : firstNodeProgress + (1 - firstNodeProgress) * (pointIndex - 1) / (pointCount - 2);
                    const lateralOffset = pointIndex === 0 || pointIndex === pointCount - 1
                        ? 0
                        : bendDirection * bendOffset * (pointIndex % 2 === 1 ? 1 : -1);
                    return {
                        x: CX + dirX * spreadAdjusted * t + perpX * lateralOffset,
                        y: CY + dirY * spreadAdjusted * t + perpY * lateralOffset
                    };
                });
                const segments = points.slice(0, -1).map((start, index) => {
                    const end = points[index + 1];
                    return {
                        start,
                        end,
                        length: Math.hypot(end.x - start.x, end.y - start.y)
                    };
                });
                const totalLength = segments.reduce((sum, segment) => sum + segment.length, 0);
                return {
                    p0: points[0],
                    p3: points[points.length - 1],
                    points,
                    segments,
                    totalLength,
                    angle,
                    dirX,
                    dirY,
                    perpX,
                    perpY
                };
            }

            function buildPathD(geom) {
                return geom.points.map((point, index) => {
                    const command = index === 0 ? 'M' : 'L';
                    return `${command} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`;
                }).join(' ');
            }

            function getPolylinePoint(geom, progress) {
                const targetDistance = Math.min(Math.max(progress, 0), 1) * geom.totalLength;
                let traveledDistance = 0;
                for (const segment of geom.segments) {
                    if (targetDistance <= traveledDistance + segment.length) {
                        const segmentProgress = segment.length === 0
                            ? 0
                            : (targetDistance - traveledDistance) / segment.length;
                        return {
                            x: segment.start.x + (segment.end.x - segment.start.x) * segmentProgress,
                            y: segment.start.y + (segment.end.y - segment.start.y) * segmentProgress
                        };
                    }
                    traveledDistance += segment.length;
                }
                return geom.p3;
            }

            function drawBranches(core, branchDefs) {
                branchesContainer.innerHTML = '';
                const paths = [];
                core.branchAngles.forEach((angleDeg, i) => {
                    const def = branchDefs[i % branchDefs.length];
                    const curve = core.branchCurves[i] || 0;
                    const length = core.branchLengths[i] || 300;
                    const spread = core.branchSpread || 1.0;
                    const nodeCount = core.branchNodeCounts[i] || def.nodes.length;
                    const geom = computeBranchGeometry(angleDeg, curve, length, spread, nodeCount);

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', buildPathD(geom));
                    path.setAttribute('class', 'branch-path');
                    path.setAttribute('stroke', `url(#${def.gradient})`);
                    path.setAttribute('stroke-width', '4.5');
                    path.setAttribute('stroke-linecap', 'round');
                    path.setAttribute('fill', 'none');
                    path.setAttribute('filter', 'url(#softGlow)');
                    path.setAttribute('opacity', '0.85');
                    path.dataset.branchIndex = i;
                    branchesContainer.appendChild(path);

                    const glowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    glowPath.setAttribute('d', buildPathD(geom));
                    glowPath.setAttribute('class', 'branch-path');
                    glowPath.setAttribute('stroke', def.color);
                    glowPath.setAttribute('stroke-width', '12');
                    glowPath.setAttribute('stroke-linecap', 'round');
                    glowPath.setAttribute('fill', 'none');
                    glowPath.setAttribute('filter', 'url(#glowFilter)');
                    glowPath.setAttribute('opacity', '0.25');
                    branchesContainer.appendChild(glowPath);

                    paths.push({ geom, def, index: i });
                });
                return paths;
            }

            function drawNodes(core, branchDefs, branchPaths) {
                nodesContainer.innerHTML = '';
                branchPaths.forEach(({ geom, def, index }) => {
                    const nodeCount = core.branchNodeCounts[index] || def.nodes.length;
                    const branchNodes = def.nodes.slice(0, nodeCount);

                    branchNodes.forEach((nodeData, nodeIdx) => {
                        const pos = geom.points[nodeIdx + 1];
                        const baseRadius = 16 + nodeIdx * 2.5;
                        const radius = Math.min(baseRadius, 26);

                        const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                        group.setAttribute('class', 'node-group');
                        group.setAttribute('transform', `translate(${pos.x.toFixed(1)}, ${pos.y.toFixed(1)})`);
                        // 记录分支颜色，激活时通过 CSS 变量恢复
                        group.style.setProperty('--node-color', def.color);

                        // 外发光
                        const outerGlow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        outerGlow.setAttribute('class', 'node-outer');
                        outerGlow.setAttribute('r', radius + 10);
                        outerGlow.setAttribute('fill', def.color);
                        outerGlow.setAttribute('opacity', '0.2');
                        outerGlow.setAttribute('filter', 'url(#strongGlow)');
                        group.appendChild(outerGlow);

                        const mainCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        mainCircle.setAttribute('class', 'node-main');
                        mainCircle.setAttribute('r', radius);
                        mainCircle.setAttribute('fill', 'url(#coreInnerGlow)');
                        mainCircle.setAttribute('opacity', '0.5');
                        group.appendChild(mainCircle);

                        const colorCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        colorCircle.setAttribute('class', 'node-color');
                        colorCircle.setAttribute('r', radius - 3);
                        colorCircle.setAttribute('fill', def.color);
                        colorCircle.setAttribute('opacity', '0.75');
                        colorCircle.setAttribute('stroke', 'rgba(255,255,255,0.35)');
                        colorCircle.setAttribute('stroke-width', '1.5');
                        group.appendChild(colorCircle);

                        const innerGlow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        innerGlow.setAttribute('class', 'node-inner');
                        innerGlow.setAttribute('r', radius - 6);
                        innerGlow.setAttribute('fill', 'rgba(255,255,255,0.2)');
                        innerGlow.setAttribute('opacity', '0.5');
                        group.appendChild(innerGlow);

                        const iconPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        iconPath.setAttribute('class', 'node-icon');
                        const iconScale = radius / 16;
                        const iconData = ICONS[nodeData.icon] || ICONS.star;
                        iconPath.setAttribute('d', iconData);
                        iconPath.setAttribute('transform', `translate(${-12 * iconScale}, ${-12 * iconScale}) scale(${iconScale})`);
                        iconPath.setAttribute('fill', '#fff');
                        iconPath.setAttribute('opacity', '0.9');
                        iconPath.setAttribute('pointer-events', 'none');
                        group.appendChild(iconPath);

                        if (nodeIdx === branchNodes.length - 1) {
                            const pulseRing = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                            pulseRing.setAttribute('class', 'node-pulse-ring');
                            pulseRing.setAttribute('r', radius);
                            pulseRing.setAttribute('fill', 'none');
                            pulseRing.setAttribute('stroke', def.color);
                            pulseRing.setAttribute('stroke-width', '2');
                            pulseRing.setAttribute('opacity', '0.7');
                            pulseRing.setAttribute('style', `animation-delay: ${index * 0.4}s`);
                            group.appendChild(pulseRing);
                        }

                        // 重绘时恢复已激活状态
                        const stateKey = `${def.id}-${nodeIdx}`;
                        if (activatedNodes.has(stateKey)) {
                            group.classList.add('activated');
                        }

                        // 事件：左键激活、右键取消激活、悬浮提示
                        group.addEventListener('mouseenter', (e) => showNodeTooltip(e, nodeData, def, nodeIdx, branchNodes.length));
                        group.addEventListener('mouseleave', hideTooltip);
                        group.addEventListener('mousemove', moveTooltip);
                        group.addEventListener('click', () => activateNode(group, def, nodeIdx, nodeData));
                        group.addEventListener('contextmenu', (e) => {
                            e.preventDefault();
                            deactivateNode(group, def, nodeIdx, nodeData);
                        });

                        nodesContainer.appendChild(group);
                    });
                });
            }

            function drawCore(core) {
                coreContainer.innerHTML = '';
                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                group.setAttribute('class', 'core-node');
                group.setAttribute('transform', `translate(${CX}, ${CY})`);

                const outerGlow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                outerGlow.setAttribute('r', 70);
                outerGlow.setAttribute('fill', core.glowColor);
                outerGlow.setAttribute('opacity', '0.15');
                outerGlow.setAttribute('filter', 'url(#strongGlow)');
                group.appendChild(outerGlow);

                const pulseRing1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                pulseRing1.setAttribute('class', 'core-pulse-ring');
                pulseRing1.setAttribute('r', 32);
                pulseRing1.setAttribute('fill', 'none');
                pulseRing1.setAttribute('stroke', core.glowColor);
                pulseRing1.setAttribute('stroke-width', '2.5');
                pulseRing1.setAttribute('opacity', '0.6');
                group.appendChild(pulseRing1);

                const pulseRing2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                pulseRing2.setAttribute('class', 'core-pulse-ring');
                pulseRing2.setAttribute('r', 32);
                pulseRing2.setAttribute('fill', 'none');
                pulseRing2.setAttribute('stroke', '#ffd700');
                pulseRing2.setAttribute('stroke-width', '1.5');
                pulseRing2.setAttribute('opacity', '0.4');
                pulseRing2.setAttribute('style', 'animation-delay: 1.5s');
                group.appendChild(pulseRing2);

                const mainCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                mainCircle.setAttribute('r', 36);
                mainCircle.setAttribute('fill', 'url(#coreInnerGlow)');
                mainCircle.setAttribute('stroke', '#ffd700');
                mainCircle.setAttribute('stroke-width', '3');
                mainCircle.setAttribute('filter', 'url(#softGlow)');
                group.appendChild(mainCircle);

                const colorOverlay = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                colorOverlay.setAttribute('r', 32);
                colorOverlay.setAttribute('fill', core.color);
                colorOverlay.setAttribute('opacity', '0.5');
                group.appendChild(colorOverlay);

                const iconPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const iconData = ICONS[core.icon] || ICONS.star;
                iconPath.setAttribute('d', iconData);
                iconPath.setAttribute('transform', 'translate(-24, -24) scale(2)');
                iconPath.setAttribute('fill', '#fff');
                iconPath.setAttribute('opacity', '0.95');
                iconPath.setAttribute('pointer-events', 'none');
                group.appendChild(iconPath);

                group.addEventListener('mouseenter', (e) => showCoreTooltip(e, core));
                group.addEventListener('mouseleave', hideTooltip);
                group.addEventListener('mousemove', moveTooltip);

                coreContainer.appendChild(group);
            }

            function drawDecorations(core, branchPaths) {
                decorContainer.innerHTML = '';
                const ring1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                ring1.setAttribute('cx', CX);
                ring1.setAttribute('cy', CY);
                ring1.setAttribute('r', 52);
                ring1.setAttribute('fill', 'none');
                ring1.setAttribute('stroke', 'rgba(255,215,0,0.25)');
                ring1.setAttribute('stroke-width', '1.5');
                ring1.setAttribute('stroke-dasharray', '8 8');
                ring1.setAttribute('filter', 'url(#glowFilter)');
                ring1.setAttribute('pointer-events', 'none');
                ring1.setAttribute('opacity', '0.7');
                decorContainer.appendChild(ring1);

                const ring2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                ring2.setAttribute('cx', CX);
                ring2.setAttribute('cy', CY);
                ring2.setAttribute('r', 48);
                ring2.setAttribute('fill', 'none');
                ring2.setAttribute('stroke', 'rgba(255,200,100,0.15)');
                ring2.setAttribute('stroke-width', '6');
                ring2.setAttribute('filter', 'url(#softGlow)');
                ring2.setAttribute('pointer-events', 'none');
                ring2.setAttribute('opacity', '0.5');
                decorContainer.appendChild(ring2);

                branchPaths.forEach(({ geom, def }) => {
                    const { p3 } = geom;
                    const dot1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    dot1.setAttribute('cx', p3.x.toFixed(1));
                    dot1.setAttribute('cy', p3.y.toFixed(1));
                    dot1.setAttribute('r', 8);
                    dot1.setAttribute('fill', def.color);
                    dot1.setAttribute('opacity', '0.6');
                    dot1.setAttribute('filter', 'url(#softGlow)');
                    decorContainer.appendChild(dot1);

                    const dot2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    dot2.setAttribute('cx', p3.x.toFixed(1));
                    dot2.setAttribute('cy', p3.y.toFixed(1));
                    dot2.setAttribute('r', 4);
                    dot2.setAttribute('fill', '#fff');
                    dot2.setAttribute('opacity', '0.8');
                    dot2.setAttribute('filter', 'url(#glowFilter)');
                    decorContainer.appendChild(dot2);

                    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    label.setAttribute('x', (p3.x + geom.dirX * 50).toFixed(1));
                    label.setAttribute('y', (p3.y + geom.dirY * 50).toFixed(1));
                    label.setAttribute('text-anchor', 'middle');
                    label.setAttribute('fill', def.color);
                    label.setAttribute('font-size', '13');
                    label.setAttribute('font-weight', 'bold');
                    label.setAttribute('font-family', 'Georgia, serif');
                    label.setAttribute('letter-spacing', '1.5');
                    label.setAttribute('filter', 'url(#glowFilter)');
                    label.setAttribute('opacity', '0.8');
                    label.setAttribute('pointer-events', 'none');
                    label.textContent = def.name;
                    decorContainer.appendChild(label);
                });
            }

            function setupFlowOrbs(branchPaths) {
                flowOrbsContainer.innerHTML = '';
                flowOrbs = [];
                branchPaths.forEach(({ geom, def, index }) => {
                    const orb = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    orb.setAttribute('class', 'flow-orb');
                    orb.setAttribute('r', '3.5');
                    orb.setAttribute('fill', '#fff');
                    orb.setAttribute('opacity', '0.8');
                    orb.setAttribute('filter', 'url(#glowFilter)');
                    flowOrbsContainer.appendChild(orb);
                    flowOrbs.push({ orb, geom, progress: Math.random() });
                });
            }

            function animateFlowOrbs() {
                if (!flowOrbs.length) return;
                const speed = 0.0006;
                flowOrbs.forEach((fo) => {
                    fo.progress += speed;
                    if (fo.progress > 1) fo.progress = 0;
                    const pos = getPolylinePoint(fo.geom, fo.progress);
                    fo.orb.setAttribute('cx', pos.x.toFixed(1));
                    fo.orb.setAttribute('cy', pos.y.toFixed(1));
                    fo.orb.setAttribute('opacity', (0.5 + Math.sin(fo.progress * Math.PI) * 0.5).toFixed(2));
                });
                flowOrbAnimFrame = requestAnimationFrame(animateFlowOrbs);
            }

            function positionTooltip(e) {
                const oldTransform = tooltip.style.transform;
                tooltip.style.transform = 'none';
                const rect = tooltip.getBoundingClientRect();
                tooltip.style.transform = oldTransform;

                const margin = 20;
                let x = e.clientX + margin;
                let y = e.clientY - rect.height / 2;
                if (x + rect.width > window.innerWidth - margin) x = e.clientX - rect.width - margin;
                if (x < margin) x = margin;
                if (y < margin) y = margin;
                if (y + rect.height > window.innerHeight - margin) y = window.innerHeight - rect.height - margin;
                tooltip.style.left = x + 'px';
                tooltip.style.top = y + 'px';
            }

            function showNodeTooltip(e, nodeData, branchDef, nodeIdx, totalNodes) {
                tooltipIcon.textContent = '✦';
                tooltipIcon.style.background = `radial-gradient(circle, ${branchDef.color}dd, ${branchDef.colorDark})`;
                tooltipIcon.style.boxShadow = `0 0 20px ${branchDef.color}88`;
                tooltipTitle.textContent = nodeData.name;
                tooltipTier.textContent = `第${nodeData.tier}层 · ${branchDef.name} · 节点${nodeIdx+1}/${totalNodes}`;
                tooltipEffect.textContent = nodeData.effect;
                tooltipValue.textContent = nodeData.value;
                tooltipValue.style.color = branchDef.color;
                tooltip.style.borderColor = branchDef.color + '88';
                tooltip.classList.add('visible');
                void tooltip.offsetHeight;
                positionTooltip(e);
            }

            function showCoreTooltip(e, core) {
                tooltipIcon.textContent = '✦';
                tooltipIcon.style.background = `radial-gradient(circle, ${core.color}dd, ${core.glowColor})`;
                tooltipIcon.style.boxShadow = `0 0 25px ${core.glowColor}aa`;
                tooltipTitle.textContent = core.name;
                tooltipTier.textContent = '';
                tooltipEffect.textContent = core.description + '。' + core.effect;
                tooltipValue.textContent = core.value;
                tooltipValue.style.color = core.color;
                tooltip.style.borderColor = core.glowColor + 'aa';
                tooltip.classList.add('visible');
                void tooltip.offsetHeight;
                positionTooltip(e);
            }

            function moveTooltip(e) {
                if (tooltip.classList.contains('visible')) positionTooltip(e);
            }

            function hideTooltip() {
                tooltip.classList.remove('visible');
            }

            function flashHint(text) {
                hint.style.opacity = '0';
                setTimeout(() => { hint.style.opacity = '1'; }, 400);
                hint.textContent = text;
            }

            function activateNode(group, branchDef, nodeIdx, nodeData) {
                const key = `${branchDef.id}-${nodeIdx}`;
                if (activatedNodes.has(key)) return;
                activatedNodes.add(key);
                group.classList.add('activated');
                updateTalentCounter();
                flashHint(`✦ ${branchDef.name} - ${nodeData.name} · 已激活 ✦`);
            }

            function deactivateNode(group, branchDef, nodeIdx, nodeData) {
                const key = `${branchDef.id}-${nodeIdx}`;
                if (!activatedNodes.has(key)) return;
                activatedNodes.delete(key);
                group.classList.remove('activated');
                updateTalentCounter();
                flashHint(`✦ ${branchDef.name} - ${nodeData.name} · 已取消激活 ✦`);
            }

            function updateTalentCounter() {
                talentUsed.textContent = activatedNodes.size;
                counterValue.classList.remove('bump');
                void counterValue.offsetWidth;
                counterValue.classList.add('bump');
            }

            function renderTree() {
                if (flowOrbAnimFrame) cancelAnimationFrame(flowOrbAnimFrame);
                const branchPaths = drawBranches(currentCore, BRANCH_DEFS);
                drawNodes(currentCore, BRANCH_DEFS, branchPaths);
                drawCore(currentCore);
                drawDecorations(currentCore, branchPaths);
                setupFlowOrbs(branchPaths);
                flowOrbAnimFrame = requestAnimationFrame(animateFlowOrbs);
            }

            function init() {
                svg.style.opacity = '1';
                svg.style.transition = 'opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                talentTotal.textContent = BRANCH_DEFS.reduce((sum, def) => sum + def.nodes.length, 0);
                updateTalentCounter();
                renderTree();

                // 阻止天赋树画布上的浏览器默认右键菜单
                svg.addEventListener('contextmenu', (e) => e.preventDefault());

                let resizeTimeout;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(() => {
                        renderTree();
                    }, 300);
                });
            }

            init();
        })();
    </script>
</body>
